[project]
name = "homework-9-1"
version = "0.1.0"
description = "Виджет банковских операций клиента"
authors = [
    {name = "milkabubu", email = "milkabu264@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
]

[tool.poetry]
packages = [{include = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)"
]

# ========== Black - форматировщик ==========
[tool.black]
# Максимальная длина строки
line-length = 119

# ========== isort - сортировщик импортов ==========
[tool.isort]
# Используем те же настройки, что и Black
profile = "black"
line_length = 119

# ========== mypy - проверка типов ==========
[tool.mypy]
exclude = [
    "venv/",           # Исключаем виртуальное окружение
    ".venv/",          # Альтернативное название виртуального окружения
    "build/",          # Папка сборки
    "dist/",           # Папка дистрибутива
    ".mypy_cache/",    # Кэш mypy
    ".pytest_cache/",  # Кэш pytest
    "__pycache__/",    # Кэш Python
    ".git/",           # Папка Git
]

# Основные проверки
disallow_untyped_defs = true   # Все функции должны иметь аннотации типов
ignore_missing_imports = true  # Игнорируем отсутствующие импорты